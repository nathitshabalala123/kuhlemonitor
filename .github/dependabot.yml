version: 2
updates:
  # npm only: the composer setup depends on Nextcloud-internal packages and
  # failed on every run. Monthly, minor/patch only, to keep PR noise down.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
